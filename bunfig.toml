[test]
coverage = true
coverageSkipTestFiles = true

# Removes temp dirs made via tests/helpers/temp-dir.ts after every test, even
# failing ones. See CONTRIBUTING.md.
preload = ["./tests/setup.ts"]

# The scaffolding tests write throwaway projects to a temp dir and dynamically
# import their `config/bunary.ts`, so Bun counts those generated files in the
# coverage report. Exclude them so the numbers describe this package only.
coveragePathIgnorePatterns = ["**/bunary-cli-*/**"]

# Bun enforces coverageThreshold PER FILE, not against the "All files" total
# (verified on Bun 1.4.2), and an omitted key falls back to 0.9. With the
# migration runner gone the floor is src/cli.ts at ~88% lines and
# src/commands/middleware/makeMiddleware.ts at 75% functions, so the
# thresholds sit a step below those.
coverageThreshold = { lines = 0.85, functions = 0.7 }
